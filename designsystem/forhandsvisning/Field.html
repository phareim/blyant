<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field</title></head>
<body class="b-page" style="margin:0;padding:20px 24px">
<div style="display:grid;gap:16px;grid-template-columns:1fr 1fr;max-width:640px">
<label class="b-field"><span class="b-field__label">Navn på brett</span><input class="b-input" id="p-name" value="Myra ved vannet"></label>
<label class="b-field"><span class="b-field__label">E-post</span><input class="b-input" id="p-mail" aria-invalid="true" value="kari.eksempel.no"><span class="b-field__hint b-field__hint--error">Skriv en adresse med @.</span></label>
<label class="b-field"><span class="b-field__label">Radius</span><span class="b-select"><select class="b-input" id="p-rad"><option>3 · 37 felt</option><option selected>4 · 61 felt</option></select></span></label>
<label class="b-field"><span class="b-field__label">Notat</span><textarea class="b-input" id="p-note" placeholder="Flere fjell, færre trær …" style="min-height:44px"></textarea></label>
<input class="b-input b-input--line" id="p-filter" aria-label="Filter" placeholder="Filter" style="grid-column:1/-1">
</div>
<script>Blyant.ink(document);if(document.fonts)document.fonts.ready.then(function(){Blyant.reink(document)});</script>
</body>
</html>
