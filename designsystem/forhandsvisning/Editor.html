<!doctype html>
<html>
<head><meta charset="utf-8"><title>Editor</title></head>
<body class="b-page" style="margin:0;padding:20px 24px">
<div class="b-editor" contenteditable="true" spellcheck="false" style="max-width:34em;outline:none">
<div class="b-editor__h1"><span class="b-editor__syntax"># </span>Skisse først</div>
<div>Sett rammene med <span class="b-editor__syntax">**</span><strong>blyant</strong><span class="b-editor__syntax">**</span> før noen velger farger. <mark>Pynten kommer etterpå.</mark></div>
<div class="b-editor__h2"><span class="b-editor__syntax">## </span>Hvorfor</div>
<div class="b-editor__quote"><span class="b-editor__syntax">&gt; </span>Det du ikke kan tegne, kan du ikke bygge.</div>
<div><span class="b-editor__rule"></span></div>
<div><span class="b-editor__syntax">- </span>et punkt med <span class="b-editor__syntax">`</span><span class="b-editor__code">kode</span><span class="b-editor__syntax">`</span></div>
<div class="b-editor__placeholder">Skriv videre …</div>
</div>
<script>Blyant.ink(document);if(document.fonts)document.fonts.ready.then(function(){Blyant.reink(document)});</script>
</body>
</html>
