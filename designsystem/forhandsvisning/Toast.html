<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast</title></head>
<body class="b-page" style="margin:0;padding:20px 24px">
<div style="display:grid;gap:16px;justify-items:start">
<div class="b-toast" role="status"><span>Dokumentet er slettet.</span><button class="b-toast__action" type="button">Angre</button></div>
<div class="b-toast b-toast--error" role="status"><span>Fikk ikke lagret. Du er uten nett.</span></div>
</div>
<script>Blyant.ink(document);if(document.fonts)document.fonts.ready.then(function(){Blyant.reink(document)});</script>
</body>
</html>
