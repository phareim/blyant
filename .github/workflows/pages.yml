# Bygger Blyant og publiserer testflaten + dist/ til GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bygg dist/ og eksempelet
        run: python3 build.py
      - name: Sett sammen siden
        run: |
          mkdir -p _site
          cp examples/hex-skisse/index.html _site/index.html
          cp -r dist _site/dist
          cp tokens.json _site/tokens.json
          cp docs/hex-skisse.png _site/hex-skisse.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
